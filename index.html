<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="lofiski's space — 写代码，拍照片，读些书。" />
    <meta property="og:title" content="airlofi" />
    <meta property="og:description" content="lofiski's space — 写代码，拍照片，读些书。" />
    <meta property="og:url" content="https://125815.xyz" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@maze1368" />

    <title>airlofi</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate" type="application/rss+xml" title="lofiski's blog" href="/rss.xml" />

    <!-- Apply the stored theme before first paint, otherwise light-theme users flash dark. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light') document.documentElement.setAttribute('data-theme', 'light')
      } catch (e) {}
    </script>

    <!--
      Fonts are linked here rather than @import-ed from main.css: an @import is only
      discovered after the stylesheet is parsed, which serialises the requests.
      Only the weights actually used are requested — CJK faces are heavy.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;700&family=JetBrains+Mono:wght@400&display=swap"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
